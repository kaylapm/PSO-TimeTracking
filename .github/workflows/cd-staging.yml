name: Continuous Development - Staging (CD)

on:
  push:
    branches: ['staging']

env:
  AZURE_CONTAINER_REGISTRY: 'registrytimetracking.azurecr.io'
  CONTAINER_NAME: 'ardine-app'

jobs:
  Quality_Job:
    name: Quality Job (Lint, Format & Typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting (ESLint)
        run: npx eslint .

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Type Checking (TypeScript)
        run: npx tsc --noEmit

  Test_Job:
    name: Test Job (Unit Testing)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Unit Testing (Jest)
        run: npm test

  Build_Job:
    name: Build Job (Build Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Validation (Next.js)
        run: npm run build

  Deploy_Staging:
    name: Deploy to Staging App Service
    needs: [Quality_Job, Test_Job, Build_Job]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.CONTAINER_NAME }}:staging

  Smoke_Test:
    name: Staging Smoke Test
    needs: Deploy_Staging
    runs-on: ubuntu-latest

    steps:
      - name: Verify Staging Web App is Alive
        run: |
          echo "Waiting 60 seconds for Azure App Service to pull the new container..."
          sleep 60
          echo "Pinging Staging URL..."
          for i in {1..10}; do
            # Using -k (insecure) if SSL cert is self-signed or has issues in staging, but standard is good
            if curl -s -f -I https://timetracking-app-staging.azurewebsites.net/ > /dev/null; then
              echo "Smoke test passed! Staging site is up."
              exit 0
            else
              echo "Site not ready yet. Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "Smoke test failed! Staging site is not responding."
          exit 1

  Notify_Discord:
    name: Send Notification to Discord
    needs: [Quality_Job, Test_Job, Build_Job, Deploy_Staging, Smoke_Test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord Channel
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          # Menentukan warna embed Discord (Merah jika ada yang gagal, Hijau jika semuanya sukses)
          status: "${{ (contains(needs.Quality_Job.result, 'failure') || contains(needs.Test_Job.result, 'failure') || contains(needs.Build_Job.result, 'failure') || contains(needs.Deploy_Staging.result, 'failure') || contains(needs.Smoke_Test.result, 'failure')) && 'Failure' || 'Success' }}"
          # Judul notifikasi berubah otomatis berdasarkan hasil seluruh job
          title: "${{ (contains(needs.Quality_Job.result, 'failure') || contains(needs.Test_Job.result, 'failure') || contains(needs.Build_Job.result, 'failure') || contains(needs.Deploy_Staging.result, 'failure') || contains(needs.Smoke_Test.result, 'failure')) && '❌ ALARM: Pipeline Ardine Staging Gagal!' || '✅ HORE: Pipeline Ardine Staging Sukses!' }}"
          description: |
            **Pemicu:** Push/Merge dari branch `${{ github.ref_name }}`

            **📊 Laporan Tiap Stage:**
            - 🧹 **Quality Check:** `${{ needs.Quality_Job.result }}`
            - 🧪 **Unit Testing:** `${{ needs.Test_Job.result }}`
            - 🏗️ **Build Validation:** `${{ needs.Build_Job.result }}`
            - 🐳 **Deploy to Staging:** `${{ needs.Deploy_Staging.result }}`
            - 🔍 **Smoke Testing:** `${{ needs.Smoke_Test.result }}`

            *(Jika ada yang bernilai 'failure', segera klik tombol di bawah untuk melihat log error di GitHub)*
