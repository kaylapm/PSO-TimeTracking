name: Continuous Integration (CI)

on:
  pull_request:
    branches: ['staging', 'main']

jobs:
  Quality_Job:
    name: Quality Job (Lint, Format & Typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting (ESLint)
        run: |
          echo "Running ESLint"
          npx eslint .

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Type Checking (TypeScript)
        run: npx tsc --noEmit

  Test_Job:
    name: Test Job (Unit Testing)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Unit Testing (Jest)
        run: npm test

  Build_Job:
    name: Build Job (Build Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Validation (Next.js)
        run: npm run build
