name: Continuous Development - Production (CD)

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
      - 'LICENSE'
      - 'ardine_ddl.sql'
      - '.idea/**'
      - '.vscode/**'
      - '.qodo/**'

env:
  AZURE_CONTAINER_REGISTRY: 'registrytimetracking.azurecr.io'
  CONTAINER_NAME: 'ardine-app'

jobs:
  Build_Job:
    name: Build Job (Build Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Validation (Next.js)
        run: npm run build

  Deploy_Production:
    name: Deploy to Production App Service
    needs: [Build_Job]
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://timetracking-app-prod.azurewebsites.net/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.CONTAINER_NAME }}:latest

  Notify_Discord:
    name: Send Notification to Discord
    needs: [Build_Job, Deploy_Production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord Channel
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          # Menentukan warna embed Discord (Merah jika ada yang gagal, Hijau jika semuanya sukses)
          status: "${{ (contains(needs.Build_Job.result, 'failure') || contains(needs.Deploy_Production.result, 'failure')) && 'Failure' || 'Success' }}"
          # Judul notifikasi berubah otomatis berdasarkan hasil seluruh job
          title: "${{ (contains(needs.Build_Job.result, 'failure') || contains(needs.Deploy_Production.result, 'failure')) && '❌ ALARM: Pipeline Ardine Gagal!' || '✅ HORE: Pipeline Ardine Sukses!' }}"
          description: |
            **Pemicu:** Push/Merge dari branch `${{ github.ref_name }}`

            **📊 Laporan Tiap Stage:**
            - 🏗️ **Build Validation:** `${{ needs.Build_Job.result }}`
            - 🐳 **Deploy to Production:** `${{ needs.Deploy_Production.result }}`

            *(Jika ada yang bernilai 'failure', segera klik tombol di bawah untuk melihat log error di GitHub)*

      - name: Write Summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`$GITHUB_REF_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`$(echo "$GITHUB_SHA" | cut -c1-7)\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ **Build Validation:** \`${{ needs.Build_Job.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 **Deploy to Production:** \`${{ needs.Deploy_Production.result }}\`" >> $GITHUB_STEP_SUMMARY
