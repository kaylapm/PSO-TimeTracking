name: Ardine CI/CD Pipeline

on:
  push:
    branches: [ "staging", "main" ]
  pull_request:
    branches: [ "staging", "main" ]

env:
  AZURE_CONTAINER_REGISTRY: "registrytimetracking.azurecr.io"
  CONTAINER_NAME: "ardine-app"

jobs:
  # -------------------------------------------------------------
  # STAGE 2: GITHUB ACTIONS CI PIPELINE
  # -------------------------------------------------------------
  Continuous_Integration:
    name: Code Quality and Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Job 1 - Install Dependencies
        run: npm ci
        
      - name: Job 2 - Linting
        run: |
          echo "Working directory:"
          pwd
          echo "Listing files:"
          ls -la
          echo "Running ESLint directly to avoid Next CLI parsing issues"
          npx --no-install eslint --version || npm run -s lint -- --version || true
          # Run ESLint over project files. Fall back to `npm run lint` if ESLint binary missing.
          if [ -x ./node_modules/.bin/eslint ]; then
            ./node_modules/.bin/eslint . --ext .ts,.tsx,.js,.jsx --ignore-path .gitignore
          else
            npx eslint . --ext .ts,.tsx,.js,.jsx --ignore-path .gitignore
          fi
        
      - name: Job 3 - Formatting Check
        run: npm run format:check
        
      - name: Job 4 - Type Checking
        run: npx tsc --noEmit
        
      - name: Job 5 - Unit Testing
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB_STAGING }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
        run: npm test
        
      - name: Job 6 - Build Validation
        run: npm run build

  # -------------------------------------------------------------
  # STAGE 3: DOCKER BUILD & PUSH TO ACR (Auto-Deploy via Azure CD)
  # -------------------------------------------------------------
  Docker_Build_Push:
    name: Build & Push to ACR
    needs: Continuous_Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Logika pemisahan Tag untuk Staging dan Production
      - name: Set Docker Tag
        id: set-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.CONTAINER_NAME }}:${{ steps.set-tag.outputs.tag }}

  # -------------------------------------------------------------
  # STAGE 4: DISCORD NOTIFICATION
  # -------------------------------------------------------------
  Notify_Discord:
    name: Send Notification to Discord
    needs: [Continuous_Integration, Docker_Build_Push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord Channel
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deploy Ardine"
          description: "Branch: ${{ github.ref_name }}"