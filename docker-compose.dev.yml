version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: ardine-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ardine}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./ardine_ddl.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ardine-network-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: ardine-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      # Database configuration
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ardine}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ardine-network-dev

networks:
  ardine-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
